<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Guias</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <button onclick="goBack()" class="back-btn">⬅ Voltar</button>
      <h1 id="achievementTitle">Carregando...</h1>
      <p id="gameName"></p>
    </header>

    <main>
      <h2>📘 Guias</h2>
      <div id="guidesContainer"></div>
    </main>

    <div class="guide-actions">
      <button id="toggleGuideForm" class="primary-btn">+ Criar guia</button>
    </div>

    <form id="guideForm" class="guide-form hidden">
      <input
        type="text"
        id="guideTitle"
        placeholder="Título do guia"
        required
      />

      <textarea
        id="guideDescription"
        placeholder="Descreva como obter essa conquista..."
        required
      ></textarea>

      <input
        type="url"
        id="guideUrl"
        placeholder="Link (YouTube, artigo, etc)"
      />

      <button type="submit">Salvar guia</button>
    </form>

    <!-- IMPORTANTE: script no FINAL -->
    <script src="js/guide.js"></script>
  </body>
</html>
