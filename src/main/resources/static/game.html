<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wexp - Jogo</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container header-content">
        <button id="backBtn" class="back-btn">← Voltar</button>
        <h1 id="gameTitle">Carregando...</h1>
      </div>
    </header>

    <main class="container">
      <!-- HERO / DETALHES -->
      <section class="game-hero">
        <img id="gameImage" class="game-cover" />

        <div class="game-meta">
          <h2 id="gameTitleSecondary">...</h2>
          <p class="muted">Informações do jogo</p>
        </div>
      </section>

      <!-- TABS -->
      <section class="tabs-section">
        <div class="tabs">
          <button data-tab="achievements" class="tab active">
            🏆 Conquistas
          </button>
          <button data-tab="guides" class="tab">📘 Guias</button>
        </div>
        <input
          type="text"
          id="achievementSearch"
          placeholder="Filtrar conquistas..."
          class="achievement-search"
        />

        <div id="tabContent" class="tab-content"></div>
      </section>
    </main>

    <script src="js/game.js"></script>
  </body>
</html>
