<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guia</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="guide-detail.css" />
    <link rel="stylesheet" href="/css/markdown.css" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <a id="logo" href="/index.html" class="logo">Wexp</a>
      </div>
    </header>

    <main class="container">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="achievement-hero">
        <img id="achievementIcon" class="achievement-hero-icon" />

        <div class="achievement-hero-info">
          <h1 id="achievementTitle">...</h1>
          <p id="gameName" class="muted"></p>
        </div>
      </div>
      <article class="guide-detail">
        <p id="guideTitle"></p>
        <hr />
        <div id="guideDescription"></div>
      </article>

      <button id="editBtn" class="primary-btn">Editar guia</button>

      <section id="historySection" style="display: none; margin-top: 40px">
        <hr style="margin-bottom: 20px; opacity: 0.2" />

        <button
          id="toggleHistoryBtn"
          class="secondary-btn"
          style="
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            background: #2a475e;
            color: white;
            border: none;
            font-weight: bold;
          "
        >
          Visualizar histórico de alterações (▼)
        </button>

        <div id="historyWrapper" class="history-wrapper">
          <div id="historyContainer" class="history-inner"></div>
        </div>
      </section>
    </main>

    <script type="module" src="guide-detail.js"></script>
    <script src="/js/breadcrumbs.js"></script>
  </body>
</html>
