<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Guia</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="create-guide.css" />
  </head>

  <body>
    <header class="header">
      <div class="container header-content">
        <div>
          <button id="backBtn" class="back-btn">← Voltar</button>
          <h1>Criar guia</h1>
          <p id="achievementName" class="muted"></p>
        </div>
      </div>
    </header>

    <main class="container">
      <form id="guideForm" class="guide-form">
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="title" required />
        </div>

        <div class="form-group">
          <label>Descrição</label>
          <textarea id="description" required></textarea>
        </div>

        <button type="submit" class="primary-btn">Salvar guia</button>
      </form>
    </main>

    <script src="create-guide.js"></script>
  </body>
</html>
