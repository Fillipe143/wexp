<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Guia</title>

    <script src="/js/components/Header.js" defer></script>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="create-guide.css" />
    <link rel="stylesheet" href="/css/markdown.css" />
  </head>

  <body>
    <wexp-header></wexp-header>
    <main class="container">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <form id="guideForm" class="guide-form">
        <div>
          <h1>Criar guia</h1>
          <p id="achievementName" class="muted"></p>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="title" required />
        </div>

        <div class="form-group">
          <label>Conteúdo do guia</label>

          <div class="markdown-layout">
            <textarea
              id="description"
              required
              placeholder="# Meu guia..."
            ></textarea>

            <div id="markdownPreview" class="markdown-preview"></div>
          </div>
        </div>

        <button type="submit" class="primary-btn">Salvar guia</button>
      </form>
    </main>

    <script type="module" src="create-guide.js"></script>
    <script src="/js/breadcrumbs.js"></script>
  </body>
</html>
