<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wexp</title>

    <script src="/js/components/Header.js" defer></script>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <wexp-header></wexp-header>

    <main class="container">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <section class="search-section">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar jogos..." />
          <button id="searchBtn">Buscar</button>
        </div>
      </section>

      <div id="defaultHomeContent">
        <section class="home-section">
          <h2 class="section-title">Mais Vendidos</h2>
          <div id="topSellersContainer" class="games">
            Carregando mais vendidos...
          </div>
        </section>

        <section class="home-section" style="margin-top: 40px">
          <h2 class="section-title">Novos Lançamentos</h2>
          <div id="newReleasesContainer" class="games">
            Carregando novidades...
          </div>
        </section>

        <section class="home-section" style="margin-top: 40px">
          <h2 class="section-title">Ofertas Especiais</h2>
          <div id="specialsContainer" class="games">Carregando ofertas...</div>
        </section>
      </div>

      <section id="gamesSection">
        <h2 class="section-title"></h2>
        <div id="gamesContainer" class="games"></div>
      </section>
    </main>

    <script src="app.js"></script>
    <script src="/js/breadcrumbs.js"></script>
  </body>
</html>
