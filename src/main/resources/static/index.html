<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wexp</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-content">
        <h1 class="logo">Wexp</h1>
        <span class="subtitle"></span>
      </div>
    </header>

    <main class="container">
      <section class="search-section">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar jogos..." />
          <button id="searchBtn">Buscar</button>
        </div>
      </section>

      <section id="gamesSection">
        <h2 class="section-title">Resultados</h2>
        <div id="gamesContainer" class="games"></div>
      </section>

      <section id="achievementsContainer" class="achievements hidden">
        <div class="achievements-header">
          <button class="back-btn" onclick="goBack()">← Voltar</button>
          <h2 class="section-title">Conquistas</h2>
        </div>

        <div id="achievementsList"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
